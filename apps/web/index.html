<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/transitopia-icon.svg" />
    <!-- viewport-fit=cover: the map runs under the status bar and screen corners; the chrome keeps to the safe area (src/index.css). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Home screen (apps/web/README.md#home-screen): iOS uses only a PNG touch icon, not the manifest's. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Transitopia" />
    <!-- Set to the header's colour for the current theme by src/Theme/Theme.tsx. -->
    <meta name="theme-color" content="#fff" />
    <!-- Search results and link previews. The page renders client-side, so this is what crawlers and chat apps read. -->
    <title>Transitopia</title>
    <meta
      name="description"
      content="Live transit and micromobility maps for Metro Vancouver. Open source and open data." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Transitopia" />
    <meta property="og:title" content="Transitopia" />
    <meta
      property="og:description"
      content="Live transit and micromobility maps for Metro Vancouver. Open source and open data." />
    <meta
      property="og:image"
      content="https://www.transitopia.org/transitopia-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The live transit map of downtown Vancouver: SkyTrain lines and buses at morning rush hour" />
    <meta property="og:locale" content="en_CA" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The site name Google shows above the result (https://developers.google.com/search/docs/appearance/site-names). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Transitopia",
        "url": "https://www.transitopia.org/"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <noscript>
      <p>
        Transitopia: Live transit and micromobility maps for Metro Vancouver.
        Open source and open data. The maps need JavaScript.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
