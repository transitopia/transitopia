name: Build Transit Data

# Published transit data for /transit: the service plans, track network and platform mapping,
# dispatched movements, observations and dispatch patches, served from https://data.transitopia.org/
# (the site's VITE_TRANSIT_DATA). It downloads every feed's GTFS static (config/feeds/*/feed.json), not
# TransLink's rate-limited Open API.
#
# The server builds and publishes this daily itself (apps/server/src/jobs/data-build.ts),
# with the corrections from its database, so its live dispatch patches fit the published plans. This
# workflow is a manual fallback only: running it while the server publishes would replace the
# server's build (and its dispatch patches would no longer fit until the server's next build).

on:
  workflow_dispatch:

jobs:
  Build-And-Upload:
    runs-on: ubuntu-latest
    env:
      RCLONE_CONFIG_TRANSITOPIA_DATA_R2_TYPE: s3
      RCLONE_CONFIG_TRANSITOPIA_DATA_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_TRANSITOPIA_DATA_R2_ENDPOINT: ${{ secrets.RCLONE_CONFIG_TRANSITOPIA_MAPS_R2_ENDPOINT }}
      RCLONE_CONFIG_TRANSITOPIA_DATA_R2_ACCESS_KEY_ID: ${{ secrets.RCLONE_CONFIG_TRANSITOPIA_DATA_R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_TRANSITOPIA_DATA_R2_SECRET_ACCESS_KEY: ${{ secrets.RCLONE_CONFIG_TRANSITOPIA_DATA_R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fetch the latest GTFS feeds and build service plans
        run: npm run data:gtfs
      - name: Build the track network and platform mapping
        run: npm run build:infra
      - name: Validate infrastructure
        run: npm run validate:infra
      - name: Build movements (runs through the dispatcher)
        run: npm run build:movements
      - name: Validate the plan
        run: npm run validate:plan
      - name: Publish observations and dispatch patches
        run: |
          npm run build:observations
          npm run build:dispatch
      - name: Install rclone
        run: |
          curl -fsSL -o /tmp/rclone.zip https://downloads.rclone.org/v1.75.0/rclone-v1.75.0-linux-amd64.zip
          sudo unzip -j -o /tmp/rclone.zip '*/rclone' -d /usr/local/bin
          rclone --version
      # The same upload as the server's (apps/server/src/jobs/publish.ts): text files compressed,
      # with their cache headers, and the files clients poll for new builds last.
      - name: Upload
        run: npm run publish:data -- transitopia_data_r2:transitopia-data
