name: Checks

on:
  pull_request:
    paths-ignore:
      - "map-layers/**"
  push:
    branches:
      - main

jobs:
  checks:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    # The server's database tests (packages/db/src/testing.ts) create a scratch database each.
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: transitopia
          POSTGRES_PASSWORD: transitopia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transitopia" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://transitopia:transitopia@localhost:5432/postgres
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint with Oxlint
        run: npm run lint
      - name: Check formatting
        run: npm run format-check
      - name: Check types
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build

  validators:
    name: Validate infrastructure and plan (fixture feed)
    runs-on: ubuntu-latest
    env:
      # A pinned TransLink GTFS static snapshot (gtfs-static.translink.ca, not the rate-limited
      # Open API), so a new upstream feed can't change the result of a PR. Bump it deliberately.
      FIXTURE_FEED_DATE: "2026-09-25"
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache the fixture feed
        uses: actions/cache@v6
        with:
          path: var/raw/gtfs
          key: gtfs-fixture-${{ env.FIXTURE_FEED_DATE }}
      - name: Fetch the fixture feed
        run: npx tsx pipelines/fetch-gtfs.ts --history "$FIXTURE_FEED_DATE"
      - name: Build the timetable and track data
        run: |
          npx tsx pipelines/build-schedule.ts
          npm run build:infra
      - name: Validate infrastructure
        run: npm run validate:infra
      - name: Build movements (runs through the dispatcher)
        run: npm run build:movements
      - name: Validate the plan
        run: npm run validate:plan
