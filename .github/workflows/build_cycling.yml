name: Build Transitopia Cycling Layer

# The cycling map's OSM file (packages/cycling-core/README.md#building-the-tiles): Geofabrik's
# British Columbia extract filtered with osmium (npm run extract:cycling-osm: the step that needs
# osmium and about 2.5 GB of memory, so it runs here), kept as an artifact and, on the daily
# schedule, published to the data bucket (data.transitopia.org/data/osm/british-columbia/), where
# the server's daily data build and npm run data:cycling fetch it. The tiles are built from it too,
# as a check: the server builds and publishes the ones the site reads.

on:
  pull_request:
    paths:
      - "packages/cycling-core/**"
      - "pipelines/build-cycling.ts"
      - "pipelines/extract-cycling-osm.ts"
      - "packages/data/src/osm-extracts.ts"
      - "config/cycling/**"
      - ".github/workflows/build_cycling.yml"
  push:
    branches:
      - main
  schedule:
    # Every day at 09:45 UTC
    - cron: "45 9 * * *"
  workflow_dispatch:
jobs:
  Build-Cycling-Layer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install tippecanoe
        uses: ./.github/actions/setup-tippecanoe
      - name: Install osmium
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends osmium-tool
          osmium --version
      - name: Download the OSM extract and keep what the cycling map needs
        run: npm run extract:cycling-osm
      - name: Build the tiles (a check; the server publishes them)
        run: npm run build:cycling
      - name: Store the cycling OSM file
        uses: actions/upload-artifact@v7
        with:
          name: cycling-osm
          path: var/raw/osm-cycling/british-columbia/
          retention-days: 14
  Deploy:
    # Only deploy this once per day in any case.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: Build-Cycling-Layer
    env:
      # The data bucket, as the transit data fallback workflow uses it (build_transit_data.yml).
      RCLONE_CONFIG_TRANSITOPIA_DATA_R2_TYPE: s3
      RCLONE_CONFIG_TRANSITOPIA_DATA_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_TRANSITOPIA_DATA_R2_ENDPOINT: ${{ secrets.RCLONE_CONFIG_TRANSITOPIA_MAPS_R2_ENDPOINT }}
      RCLONE_CONFIG_TRANSITOPIA_DATA_R2_ACCESS_KEY_ID: ${{ secrets.RCLONE_CONFIG_TRANSITOPIA_DATA_R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_TRANSITOPIA_DATA_R2_SECRET_ACCESS_KEY: ${{ secrets.RCLONE_CONFIG_TRANSITOPIA_DATA_R2_SECRET_ACCESS_KEY }}
      OSM_DEST: transitopia_data_r2:transitopia-data/data/osm/british-columbia
    steps:
      - name: Install rclone
        run: |
          curl -fsSL -o /tmp/rclone.zip https://downloads.rclone.org/v1.75.0/rclone-v1.75.0-linux-amd64.zip
          sudo unzip -j -o /tmp/rclone.zip '*/rclone' -d /usr/local/bin
          rclone --version
      - name: Download the cycling OSM file
        uses: actions/download-artifact@v8
        with:
          name: cycling-osm
          path: cycling-osm
      # The file first (its name changes with its content, so it's cached for good), then the
      # pointer clients poll (cached for 5 minutes, like the transit data's pointers); files over
      # two weeks old are removed.
      - name: Publish the cycling OSM file
        run: |
          rclone copy cycling-osm "$OSM_DEST" --include "*.opl.gz" --header-upload "Cache-Control: public, max-age=31536000, immutable" --s3-no-check-bucket
          rclone copy cycling-osm "$OSM_DEST" --include latest.json --header-upload "Cache-Control: public, max-age=300" --s3-no-check-bucket
          rclone delete "$OSM_DEST" --include "*.opl.gz" --min-age 14d
