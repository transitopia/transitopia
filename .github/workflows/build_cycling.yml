name: Build Transitopia Cycling Layer

# The cycling tiles for /cycling (packages/cycling-core/README.md): Geofabrik's British Columbia
# extract, filtered with osmium, classified by packages/cycling-core and tiled with tippecanoe
# (npm run data:cycling), published daily to the maps bucket (deployment/README.md → Map tiles).

on:
  pull_request:
    paths:
      - "packages/cycling-core/**"
      - "pipelines/build-cycling.ts"
      - "pipelines/fetch-osm-extract.ts"
      - "config/cycling/**"
      - ".github/workflows/build_cycling.yml"
  push:
    branches:
      - main
  schedule:
    # Every day at 09:45 UTC
    - cron: "45 9 * * *"
jobs:
  Build-Cycling-Layer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install tippecanoe
        uses: ./.github/actions/setup-tippecanoe
      - name: Install osmium
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends osmium-tool
          osmium --version
      - name: Download the OSM extract and build the tiles
        run: npm run data:cycling
      - name: Store resulting artifacts
        uses: actions/upload-artifact@v7
        with:
          name: compiled-maps
          path: var/public/tiles/transitopia-cycling-british-columbia.pmtiles
  Deploy:
    # Only deploy this once per day in any case.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: Build-Cycling-Layer
    env:
      RCLONE_CONFIG_TRANSITOPIA_MAPS_R2_TYPE: s3
      RCLONE_CONFIG_TRANSITOPIA_MAPS_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_TRANSITOPIA_MAPS_R2_ENDPOINT: ${{ secrets.RCLONE_CONFIG_TRANSITOPIA_MAPS_R2_ENDPOINT }}
      RCLONE_CONFIG_TRANSITOPIA_MAPS_R2_ACCESS_KEY_ID: ${{ secrets.RCLONE_CONFIG_TRANSITOPIA_MAPS_R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_TRANSITOPIA_MAPS_R2_SECRET_ACCESS_KEY: ${{ secrets.RCLONE_CONFIG_TRANSITOPIA_MAPS_R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Install rclone
        run: |
          curl -fsSL -o /tmp/rclone.zip https://downloads.rclone.org/v1.75.0/rclone-v1.75.0-linux-amd64.zip
          sudo unzip -j -o /tmp/rclone.zip '*/rclone' -d /usr/local/bin
          rclone --version
      - name: Download compiled maps
        uses: actions/download-artifact@v8
        with:
          name: compiled-maps
      - name: upload
        run: rclone copy transitopia-cycling-british-columbia.pmtiles transitopia_maps_r2:transitopia-maps --s3-no-check-bucket
