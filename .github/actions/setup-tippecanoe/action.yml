# tippecanoe for the plan and overview tiles (packages/transit-core/DESIGN.md#plan-tiles). Felt publishes
# no binaries, and Ubuntu's package is older than the server's, so it's built from source once per
# version and runner, then restored from the cache.
name: Set up tippecanoe
description: Install tippecanoe on the PATH, built from source and cached by version.
inputs:
  version:
    description: The tippecanoe release. Keep in step with TIPPECANOE_VERSION in infra/server.Dockerfile.
    default: "2.79.0"
runs:
  using: composite
  steps:
    - name: Restore tippecanoe
      id: cache
      uses: actions/cache@v6
      with:
        path: ~/.local/tippecanoe
        key: tippecanoe-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}
    - name: Build tippecanoe
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        sudo apt-get update -q
        sudo apt-get install -y --no-install-recommends libsqlite3-dev zlib1g-dev
        curl -fsSL "https://github.com/felt/tippecanoe/archive/refs/tags/${VERSION}.tar.gz" | tar xz -C /tmp
        make -C "/tmp/tippecanoe-${VERSION}" -j"$(nproc)" tippecanoe
        install -D -m 755 "/tmp/tippecanoe-${VERSION}/tippecanoe" ~/.local/tippecanoe/tippecanoe
    - name: Add tippecanoe to the PATH
      shell: bash
      run: |
        echo "$HOME/.local/tippecanoe" >> "$GITHUB_PATH"
        "$HOME/.local/tippecanoe/tippecanoe" --version
